  image_picker: ^1.1.2
  internet_connection_checker_plus: ^2.7.2
  intl: any
  isar: ^3.1.0+1
  keyboard_actions: ^4.2.0
  list_picker:
    git:
      url: https://github.com/SamuelsonPajeu/list_picker-ptbr.git
  local_auth: ^2.3.0
